name: Build os9exec (all platforms)

on:
  push:
    branches: [ master, arm64-uae-integration ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit Linux (glibc)
          - os: ubuntu-latest
            platform: linux-x64
            cc: clang
            cflags: "-fcommon"
            binary: os9exec
            artifact: os9exec-linux-x64

          # 32-bit Linux (via Docker)
          - os: ubuntu-latest
            platform: linux-i386
            cc: docker
            dockerfile: Dockerfile.linux32
            binary: os9exec
            artifact: os9exec-linux-i386

          # macOS ARM64
          - os: macos-latest
            platform: macos-arm64
            cc: clang
            cflags: ""
            binary: os9exec
            artifact: os9exec-macos-arm64

          # Windows: disabled for now, not a regression -- this leg has never
          # actually built (every CI run since the workflow was added has
          # failed here). GNUmakefile hardcodes the Linux platform files for
          # every OS, and the code's own `windows32` detection is only ever
          # reachable via __MACH__ or `linux` already being true, so it never
          # triggers on a real Windows compile -- it falls through to
          # Mac-Toolbox-only headers (Types.h etc.) instead. There's a
          # partially-started Source/Platforms/WIN32/ (net_windows.c,
          # wincmd.c) that was never wired into GNUmakefile's PLAT variable.
          # Reviving this needs: per-OS PLAT branching in GNUmakefile, a real
          # _WIN32/_MSC_VER -> windows32 bridge, and either MinGW (for the
          # POSIX-ish headers the UNIX code path assumes) or finishing out
          # genuine Win32 API code behind the `windows32` macro. Until then,
          # Windows users should use Docker (works today, see README) or
          # WSL2 (a real Linux userspace, so the already-working Linux build
          # applies as-is).
          # - os: windows-latest
          #   platform: windows-x64
          #   cc: clang
          #   cflags: "-fcommon"
          #   binary: os9exec.exe
          #   artifact: os9exec-windows-x64.exe

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu 64-bit)
      if: matrix.platform == 'linux-x64'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install llvm -y

    - name: Build os9exec (native)
      if: matrix.cc != 'docker'
      env:
        CC: ${{ matrix.cc }}
      run: |
        make clean
        make

    - name: Build os9exec (Docker 32-bit)
      if: matrix.cc == 'docker'
      run: |
        docker build -f docker/${{ matrix.dockerfile }} -t os9exec:linux32 .
        docker run --rm -v $(pwd):/workspace os9exec:linux32 cp /usr/local/bin/os9exec /workspace/os9exec

    - name: Verify binary exists
      run: |
        ls -lh os9exec* 2>/dev/null && file os9exec* || echo "Binary verification skipped (Docker build)"

    - name: Smoke test (Linux/macOS) - verify binary runs
      if: runner.os != 'Windows' && matrix.cc != 'docker'
      run: |
        OUTPUT=$(./os9exec -ih 2>&1 || true)
        echo "$OUTPUT" | head -5
        echo "$OUTPUT" | grep -q "OS9exec" || { echo "FAIL: expected OS9exec header"; exit 1; }
        echo "✓ Binary runs and shows internal help"

    - name: Smoke test (Docker 32-bit) - verify binary runs
      if: matrix.cc == 'docker'
      run: |
        OUTPUT=$(docker run --rm os9exec:linux32 -ih 2>&1 || true)
        echo "$OUTPUT" | head -5
        echo "$OUTPUT" | grep -q "OS9exec" || { echo "FAIL: expected OS9exec header"; exit 1; }
        echo "✓ 32-bit Docker image runs and shows internal help"

    - name: Smoke test (Windows) - verify binary runs
      if: runner.os == 'Windows'
      run: |
        $OUTPUT = (.\os9exec.exe -ih 2>&1) -join "`n"
        Write-Output $OUTPUT
        if ($OUTPUT -notmatch "OS9exec") { Write-Error "FAIL: expected OS9exec header"; exit 1 }
        Write-Output "✓ Binary runs and shows internal help"

    - name: Rename artifact
      if: matrix.cc == 'docker'
      run: |
        mv os9exec os9exec-linux-i386 || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: os9exec*
        retention-days: 30

  publish-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build Docker image (local, for smoke test)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: false
        load: true
        tags: os9exec:ci-test

    - name: Smoke test Docker image
      run: |
        OUTPUT=$(docker run --rm os9exec:ci-test -ih 2>&1 || true)
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -q "OS9exec" || { echo "FAIL: expected OS9exec header in output"; exit 1; }
        echo "✓ Docker image runs and shows internal help"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          os9exec-linux-x64/os9exec
          os9exec-linux-i386/os9exec-linux-i386
          os9exec-macos-arm64/os9exec
