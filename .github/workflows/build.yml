name: Build os9exec (all platforms)

on:
  push:
    branches: [ master, arm64-uae-integration ]
    # Tags must be listed explicitly. Without this the workflow does not run
    # for a tag at all, so create-release -- which is gated on
    # startsWith(github.ref, 'refs/tags/') -- could never fire, and tagging
    # produced no release and no binaries. Found while preparing the first
    # real tag; the release job had been unreachable since it was written.
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # Run the OS-9/68000 conformance suite (test/68k-conformance) against the
  # freshly built emulator. Until now CI only proved os9exec compiles and
  # starts on four platforms; nothing here executed a single OS-9 program.
  #
  # This can run in CI at all only because the suite needs no Microware
  # software: every module in its CMDS/ is our own 68000 assembly, and
  # os9exec boots a module directly, so no shell and no licensed system disk
  # are involved. conformance.sh detects the absent h0/ and takes that path
  # by itself -- which is also exactly what a stranger cloning this repo
  # gets, so this job doubles as proof the published tree is runnable.
  conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang

    - name: Build os9exec
      env:
        CC: clang
      run: make prod

    - name: Run the 68k conformance suite
      run: ./tools/conformance.sh 68k

    # The same 44 tests again, on a real RBF image instead of a host-native
    # directory. Worth the second run: 13 of them are record-locking claims
    # (t19-t31) and a host directory has no lock mechanism under it, so above
    # they report SKIP -- checked by nobody, on every push, since the suite
    # was written. A run here reports PASS=44 SKIP=0.
    #
    # This leg was added believing os9exec could already populate the image
    # with its own internal commands. It could not: only `mount` was one, and
    # `makdir`, `copy` and `dir` were resolving as Microware modules off the
    # developer's system disk -- which CI does not have and never did. The leg
    # therefore failed on its first run here and every run after. os9exec grew
    # `imakdir` and `icopy` (intcommand.c) so the claim is now true.
    - name: Run the 68k conformance suite on an RBF image
      run: ./tools/conformance.sh 68k --noshell --rbf

    # The third mode: each test as its own boot program on a host directory,
    # no shell anywhere. It is the mode conformance.sh falls back to when no
    # system disk is present, so it is what a stranger cloning this repo runs
    # by default -- and it was the one mode CI never exercised.
    - name: Run the 68k conformance suite with no shell
      run: ./tools/conformance.sh 68k --noshell

    # The self-contained CONF68K disk, built and proved in CI rather than by
    # hand. This image is the artifact a real OS-9/68k owner is asked to run
    # (readme, "AS A SINGLE DISK"), which makes it the one thing here that has
    # to still be good on the day somebody finally does. Until now it was only
    # ever built on a developer's machine, and a stale one reached a gate run
    # on 2026-09-21 and reported five MISMATCH lines that read as corruption.
    #
    # No Microware software is involved either: build-image.sh drives
    # os9exec's own internal mount/imakdir/icopy, and verify-image.sh points
    # OS9DISK at the image itself. verify-image.sh checks two separate things,
    # every file copied back off the image byte for byte AND the whole suite
    # run from it, because a disk that lists correctly and cannot run is the
    # failure worth catching.
    - name: Build and verify the self-contained CONF68K disk
      run: |
        ./tools/selfhost68k/build-image.sh
        ./tools/selfhost68k/verify-image.sh

    # Attached to releases below, so someone with real hardware downloads ONE
    # file instead of cloning and building a toolchain they have no use for.
    - name: Upload the CONF68K disk image
      uses: actions/upload-artifact@v6
      with:
        name: conf68k-disk
        path: build/selfhost68k/conf68k.dsk
        retention-days: 30

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit Linux (glibc)
          - os: ubuntu-latest
            platform: linux-x64
            cc: clang
            cflags: "-fcommon"
            binary: os9exec
            artifact: os9exec-linux-x64

          # 32-bit Linux (via Docker)
          - os: ubuntu-latest
            platform: linux-i386
            cc: docker
            dockerfile: Dockerfile.linux32
            binary: os9exec
            artifact: os9exec-linux-i386

          # macOS ARM64
          - os: macos-latest
            platform: macos-arm64
            cc: clang
            cflags: ""
            binary: os9exec
            artifact: os9exec-macos-arm64

          # Windows (cross-compiled via mingw-w64 on an Ubuntu runner).
          # GNUmakefile now has real per-OS PLAT branching and the code has
          # a working windows32/MINGW macro bridge -- see ROADMAP.md. This
          # cross-compile + Wine-smoke-test approach mirrors
          # docker/Dockerfile.windows and local dev testing, both of which
          # are actually verified working; a native windows-latest runner
          # was deliberately not used since mingw-w64 availability/setup
          # there is unverified.
          - os: ubuntu-latest
            platform: windows-x64
            cc: mingw-cross
            binary: os9exec.exe
            artifact: os9exec-windows-x64.exe

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies (Ubuntu 64-bit)
      if: matrix.platform == 'linux-x64'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm

    - name: Install dependencies (Windows cross-compile)
      if: matrix.cc == 'mingw-cross'
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 wine64 file

    - name: Build os9exec (native)
      if: matrix.cc != 'docker' && matrix.cc != 'mingw-cross'
      env:
        CC: ${{ matrix.cc }}
      run: |
        make clean
        make prod

    - name: Build os9exec (Windows cross-compile)
      if: matrix.cc == 'mingw-cross'
      run: |
        make clean
        make OS=Windows_NT CC=x86_64-w64-mingw32-gcc prod

    - name: Build os9exec (Docker 32-bit)
      if: matrix.cc == 'docker'
      run: |
        docker build -f docker/${{ matrix.dockerfile }} -t os9exec:linux32 .
        # --entrypoint override is required: the image's own ENTRYPOINT is
        # ["os9exec"], so without this, "cp ..." runs as an argument *to*
        # os9exec (tries to launch "cp" as an OS-9 program) instead of as
        # the host cp command extracting the binary.
        docker run --rm --entrypoint cp -v $(pwd):/workspace os9exec:linux32 /usr/local/bin/os9exec /workspace/os9exec

    - name: Verify binary exists
      run: |
        ls -lh os9exec* 2>/dev/null && file os9exec* || echo "Binary verification skipped (Docker build)"

    - name: Smoke test (Linux/macOS) - verify binary runs
      if: runner.os != 'Windows' && matrix.cc != 'docker' && matrix.cc != 'mingw-cross'
      run: |
        OUTPUT=$(./os9exec -ih 2>&1 || true)
        echo "$OUTPUT" | head -5
        echo "$OUTPUT" | grep -q "OS9exec" || { echo "FAIL: expected OS9exec header"; exit 1; }
        echo "✓ Binary runs and shows internal help"

    - name: Smoke test (Docker 32-bit) - verify binary runs
      if: matrix.cc == 'docker'
      run: |
        OUTPUT=$(docker run --rm os9exec:linux32 -ih 2>&1 || true)
        echo "$OUTPUT" | head -5
        echo "$OUTPUT" | grep -q "OS9exec" || { echo "FAIL: expected OS9exec header"; exit 1; }
        echo "✓ 32-bit Docker image runs and shows internal help"

    - name: Smoke test (Windows, via Wine) - verify binary runs
      if: matrix.cc == 'mingw-cross'
      run: |
        # Package is "wine64", but that package only provides the binary at
        # /usr/lib/wine/wine64 -- the wine64 apt install pulls in the "wine"
        # metapackage too, which is what actually creates /usr/bin/wine via
        # update-alternatives (resolving to wine64 since wine32 isn't
        # installed). Confirmed via a real CI run: "wine64: command not
        # found" even right after "Setting up wine64 (...)" in apt's log.
        OUTPUT=$(wine os9exec.exe -ih 2>&1 || true)
        echo "$OUTPUT" | head -5
        echo "$OUTPUT" | grep -q "OS9exec" || { echo "FAIL: expected OS9exec header"; exit 1; }
        echo "✓ Windows binary runs under Wine and shows internal help"

    # Every asset in a GitHub release shares one namespace, so each uploaded
    # file needs a DISTINCT name. Only the 32-bit Docker build was renamed,
    # which left linux-x64 and macos-arm64 both shipping a file called
    # "os9exec": the second upload overwrote the first and v4.0.0's first cut
    # contained no Linux 64-bit binary at all. Renaming every platform's
    # binary to its artifact name also makes the release match what the README
    # tells people to download. After the smoke tests, which run ./os9exec.
    - name: Rename artifact
      run: |
        mv "${{ matrix.binary }}" "${{ matrix.artifact }}"
        ls -l "${{ matrix.artifact }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact }}
        path: os9exec*
        retention-days: 30

  publish-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build Docker image (local, for smoke test)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/Dockerfile
        push: false
        load: true
        tags: os9exec:ci-test

    - name: Smoke test Docker image
      run: |
        OUTPUT=$(docker run --rm os9exec:ci-test -ih 2>&1 || true)
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -q "OS9exec" || { echo "FAIL: expected OS9exec header in output"; exit 1; }
        echo "✓ Docker image runs and shows internal help"

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create-release:
    # Gated on the conformance job as well as the builds. It used to need only
    # `build`, so a tag would have published binaries for all four platforms
    # with the conformance suite red -- and the conformance suite is the whole
    # claim this project makes about itself.
    needs: [build, conformance]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Creating a release WRITES to the repository, and this workflow's token is
    # read-only by default -- publish-docker declares its own permissions and
    # this job never did. The first tag ever pushed therefore built all four
    # binaries, passed conformance, and then failed with
    # "403 Resource not accessible by integration" at the last step.
    permissions:
      contents: write
    steps:
    # The release text is docs/release-notes-<tag>.md from the tagged tree,
    # so what a release says is reviewed in a PR like everything else. Without
    # it the release page carried the files and no words at all.
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v8

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        body_path: docs/release-notes-${{ github.ref_name }}.md
        files: |
          os9exec-linux-x64/os9exec-linux-x64
          os9exec-linux-i386/os9exec-linux-i386
          os9exec-macos-arm64/os9exec-macos-arm64
          os9exec-windows-x64.exe/os9exec-windows-x64.exe
          conf68k-disk/conf68k.dsk
