name: Build os9exec (all platforms)

on:
  push:
    branches: [ master, arm64-uae-integration ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 64-bit Linux (glibc)
          - os: ubuntu-latest
            platform: linux-x64
            cc: clang
            cflags: "-fcommon"
            binary: os9exec
            artifact: os9exec-linux-x64

          # 32-bit Linux (via Docker)
          - os: ubuntu-latest
            platform: linux-i386
            cc: docker
            dockerfile: Dockerfile.linux32
            binary: os9exec
            artifact: os9exec-linux-i386

          # macOS ARM64
          - os: macos-latest
            platform: macos-arm64
            cc: clang
            cflags: ""
            binary: os9exec
            artifact: os9exec-macos-arm64

          # Windows
          - os: windows-latest
            platform: windows-x64
            cc: clang
            cflags: "-fcommon"
            binary: os9exec.exe
            artifact: os9exec-windows-x64.exe

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu 64-bit)
      if: matrix.platform == 'linux-x64'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install llvm -y

    - name: Build os9exec (native)
      if: matrix.cc != 'docker'
      env:
        CC: ${{ matrix.cc }}
      run: |
        make clean
        make

    - name: Build os9exec (Docker 32-bit)
      if: matrix.cc == 'docker'
      run: |
        docker build -f docker/${{ matrix.dockerfile }} -t os9exec:linux32 .
        docker run --rm -v $(pwd):/workspace os9exec:linux32 cp /usr/local/bin/os9exec /workspace/os9exec

    - name: Verify binary exists
      run: |
        ls -lh os9exec* 2>/dev/null && file os9exec* || echo "Binary verification skipped (Docker build)"

    - name: Smoke test (Linux/macOS) - verify binary runs
      if: runner.os != 'Windows' && matrix.cc != 'docker'
      run: |
        ./os9exec -ih 2>&1 | head -5
        echo "✓ Binary runs without crash"

    - name: Smoke test (Docker 32-bit) - verify binary runs
      if: matrix.cc == 'docker'
      run: |
        docker run --rm os9exec:linux32 -ih 2>&1 | head -5
        echo "✓ Docker image runs without crash"

    - name: Smoke test (Windows) - verify binary runs
      if: runner.os == 'Windows'
      run: |
        .\os9exec.exe -ih 2>&1 | head -5
        echo "Binary runs without crash"

    - name: Rename artifact
      if: matrix.cc == 'docker'
      run: |
        mv os9exec os9exec-linux-i386 || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: os9exec*
        retention-days: 30

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          os9exec-linux-x64/os9exec
          os9exec-linux-i386/os9exec-linux-i386
          os9exec-macos-arm64/os9exec
          os9exec-windows-x64.exe/os9exec-windows-x64.exe
